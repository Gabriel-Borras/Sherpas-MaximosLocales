<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sherpas Life — mini demo (Michael Carter)</title>
<style>
:root{--bg:#F4F6F9;--ink:#0F172A;--mut:#526075;--line:#E2E8F0;--g:#059669;--a:#D97706;--r:#DC2626}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;justify-content:center}
main{width:100%;max-width:480px;min-height:100dvh;background:#fff;padding:16px;border:1px solid var(--line)}
h1{font-size:18px}h2{font-size:15px;margin-bottom:6px}.sub{color:var(--mut);font-size:12px}
.bar{margin:8px 0}.bar b{display:flex;justify-content:space-between;font-size:12px}
.t{height:7px;background:var(--bg);border-radius:9px;overflow:hidden}.f{height:100%;border-radius:9px}
.card{border:2px solid var(--ink);border-radius:12px;padding:12px;margin:12px 0}
button{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;margin-top:8px;font:inherit;cursor:pointer}
button:hover{border-color:var(--ink)}button small{display:block;color:var(--mut);font-size:12px}
.go{background:var(--g);color:#fff;text-align:center;font-weight:700;border:0}
.rail{position:relative;margin:14px 0;padding-left:14px;border-left:3px solid var(--g)}
.node{margin:0 0 10px;cursor:pointer}.node.off{opacity:.45}
.node i{font:700 11px monospace;color:var(--mut);font-style:normal;display:block}
.branch{margin:6px 0 10px 18px;padding:8px 10px;border-left:3px dashed var(--r);background:#FEF2F2;border-radius:0 8px 8px 0;font-size:13px}
.ok{background:#ECFDF5;border:1.5px solid var(--g);border-radius:12px;padding:12px;margin-top:12px}
.math{display:none;font:11.5px monospace;color:var(--mut);margin-top:4px}.m .math{display:block}
.tabs{display:flex;gap:6px;margin-top:12px}.tabs button{margin:0;text-align:center;font-weight:700;font-size:12px}.tabs .on{background:var(--ink);color:#fff}.chk{display:flex;gap:8px;align-items:center;margin-top:8px}.chk input{width:18px;height:18px}
.tog{width:auto;display:inline-block;padding:4px 10px;border-radius:99px;text-align:center;font-size:11px;float:right}
</style></head><body><main id="app"></main>
<script>
// All numbers come from cases/michael-carter (financial-health.json, persona.md). Nothing invented.
const pillars=[["Savings & cash flow",0,25],["Debt",8,10],["Investments",11,25],["Liquidity",4,20],["Protection",4,20]];
const fears=["Retirement shortfall (O1)","Cash for the home purchase (O2)","Life insurance gap: $720,000 (O3)","No umbrella cover (O4)"];
const nodes=[
 {y:2026,age:37,t:"Today · first move",q:"Sherpas' low-effort moves. Which do you do first?",
  opts:[["Add $1M umbrella cover","score 26 → 31",31,1],["Raise growth allocation 74% → 88%","score 26 → 31 · ~$19,900 moved",31,1],["Keep everything as is","score stays 26",26,0]],
  math:"top_moves[0], top_moves[2]"},
 {y:2027,age:38,t:"Home purchase (plan event)",event:1,q:"Your plan buys the $550,000 home in January 2027. Investable assets go $178,717 → $81,172 and cash covers 0 months afterwards.",
  opts:[["Buy as planned","$113,300 down · $3,015/mo",null],["Ask my advisor to model a delay","Not scored: Sherpas has no calculated alternative → goes to Advisor Brief",null]],
  math:"yearly 2026→2027; persona O2/T1"},
 {y:2047,age:58,t:"Retire at 58",q:"Savings must cover ~$59,613/yr (5.6% average draw). How do you retire?",
  opts:[["Cut withdrawals to $10,300/yr","score 26 → 62 (biggest published lift)",62,1],["Keep the 5.6% draw","score stays 26",26,0]],
  math:"top_moves[1] · retirementGap $1,177,586"}
];
let S;
function reset(){S={step:-1,fear:[],score:26,done:[],math:false,tab:'act',sel:null,checks:[false,false,false]};render()}
const bar=(l,v,m,c)=>`<div class=bar><b><span>${l}</span><span>${v}</span></b><div class=t><div class=f style="width:${m}%;background:${c}"></div></div></div>`;
const col=p=>p>=70?'var(--g)':p>=40?'var(--a)':'var(--r)';
function hud(){return `<h1>Michael Carter · 37 <button class=tog onclick="S.math=!S.math;render()">${S.math?'Math':'Plain'}</button></h1>
<div class=sub>Austin, TX · $180k/yr · Goal: retire at 58</div>`+pillars.map(p=>bar(p[0],p[1]+'/'+p[2],p[1]/p[2]*100,col(p[1]/p[2]*100))).join('')+bar('Plan score if you act',S.score,S.score,col(S.score))}
function render(){
 let h=`<div class="${S.math?'m':''}">`+hud();
 if(S.step<0){
  h+=`<div class=card><h2>Quest: what worries you most?</h2><div class=sub>Tap in order, most worrying first (${S.fear.length}/4)</div>`+
   fears.map((f,i)=>S.fear.includes(i)?'':`<button onclick="S.fear.push(${i});if(S.fear.length==3)S.fear.push([0,1,2,3].find(x=>!S.fear.includes(x)));if(S.fear.length==4)S.step=0;render()">${f}</button>`).join('')+`</div>`;
 }else{
  const fin=S.done.length==nodes.length;
  const rail=tl(fin);
  const n=nodes[S.step];
  if(!fin){h+=rail;
   if(n&&S.done.length==S.step)h+=`<div class=card><i class=sub>${n.y} · age ${n.age}</i><h2>${n.t}</h2><div>${n.q}</div><div class=math>Source: ${n.math}</div>`+n.opts.map((o,i)=>`<button onclick="pick(${i})">${o[0]}<small>${o[1]}</small></button>`).join('')+`</div>`;
  }else{
   h+=`<div class=tabs>`+[['act','Action'],['plan','My plan'],['brief','Advisor Brief']].map(t=>`<button class="${S.tab==t[0]?'on':''}" onclick="S.tab='${t[0]}';render()">${t[1]}</button>`).join('')+`</div>`;
   if(S.tab=='act'){
    const c=S.checks;
    h+=`<div class=ok><h2>Step 1 · today (3 min)</h2>Pay off the $3,500 Amex (20% APR) from your $27,000 bank cash.
    <label class=chk><input type=checkbox ${c[0]?'checked':''} onchange="S.checks[0]=this.checked;render()"> Done</label>
    <h2 style="margin-top:12px">Day 3 check-in</h2><label class=chk><input type=checkbox ${c[1]?'checked':''} onchange="S.checks[1]=this.checked;render()"> Card balance is $0</label>
    <h2 style="margin-top:12px">Day 30 check-in</h2><label class=chk><input type=checkbox ${c[2]?'checked':''} onchange="S.checks[2]=this.checked;render()"> Raised 401(k) deferral above $17,000 (limit $24,500)</label>
    <div class=sub style="margin-top:8px">${c.filter(x=>x).length}/3 done · self-reported</div></div>`;
   }else if(S.tab=='plan'){
    const Y=[[2026,178717],[2032,279056],[2038,763133],[2044,1550861],[2050,1823675],[2056,1125478],[2062,717522],[2068,316843],[2074,3288],[2080,-160752]];
    const mx=1823675,mn=-160752,pt=Y.map((p,i)=>`${10+i*31},${90-(p[1]-mn)/(mx-mn)*80}`).join(' ');
    h+=`<div class=card><h2>Investable assets (yearly, today's plan)</h2><svg viewBox="0 0 300 100" width=100%><line x1=0 x2=300 y1=${90-(0-mn)/(mx-mn)*80} y2=${90-(0-mn)/(mx-mn)*80} stroke="#DC2626" stroke-dasharray="3"/><polyline fill=none stroke="#059669" stroke-width=2 points="${pt}"/></svg>
    <div class=sub>2026 $178,717 · peak 2050 $1,823,675 · 2075 −$38,276</div></div>`+rail+`<div class=math>Source: projections.yearly</div>`;
   }else{
    const q=S.done.some(d=>d.c[0].startsWith('Ask'));
    h+=`<div class=ok><h2>For your advisor</h2><div>• Your top worry: ${fears[S.fear[0]]}</div>${q?'<div>• Model delaying the 2027 house (not calculated by Sherpas)</div>':''}${S.done.filter(d=>d.bad).map(d=>`<div>• You skipped: ${d.n.t}</div>`).join('')}<div class=sub style="margin-top:6px">Single client: no partner comparison.</div></div>`;
   }
   h+=`<button class=go style="margin-top:12px" onclick="reset()">Rewind (replay run)</button>`;
  }
 }
 document.getElementById('app').innerHTML=h+'</div>';
}

function tl(fin){
 const X=i=>70+i*190,EX=X(nodes.length)+150,cur=fin?nodes.length-1:S.step;
 let g=`<line x1=20 x2=${EX+60} y1=150 y2=150 stroke="#0F172A" stroke-width=3 />`;
 nodes.forEach((n,i)=>{const done=i<S.done.length;
  g+=`<g opacity=${done||i==cur?1:.35} style="cursor:pointer" onclick="S.sel=${i};render()"><line x1=${X(i)} x2=${X(i)} y1=138 y2=162 stroke="#0F172A" stroke-width=3 />
  <text x=${X(i)} y=180 font-size=11 font-weight=700 text-anchor=middle>${n.y}</text><text x=${X(i)} y=194 font-size=10 text-anchor=middle fill="#526075">${n.t.split(' ·')[0].slice(0,18)}</text></g>`;});
 g+=`<circle cx=${X(cur)} cy=150 r=15 fill=none stroke="#EAB308" stroke-width=3 />`;
 let k=0;
 S.done.forEach((d,i)=>{if(!d.bad)return;const up=k++%2==0,y=up?60:240,dy=up?-1:1;
  g+=`<g style="cursor:pointer" onclick="S.sel=${i};render()"><path d="M${X(i)},150 V${y-dy*14} Q${X(i)},${y} ${X(i)+16},${y} H${EX}" fill=none stroke="#9F1239" stroke-width=3 />
  <text x=${X(i)+22} y=${y+(up?-8:16)} font-size=10 fill="#9F1239">You chose: ${d.c[0].slice(0,34)}</text>
  <text x=${EX} y=${y+6} font-size=26 fill="#DC2626" text-anchor=middle font-weight=700>✕</text>
  <text x=${EX-4} y=${y+(up?-12:26)} font-size=10 fill="#DC2626" text-anchor=end font-weight=700>2075 · −$38,276</text></g>`;});
 const d=S.sel!=null&&S.done[S.sel];
 const info=d?`<div class=sub style="margin-top:6px"><b>${d.n.y} · ${d.n.t}</b>: you chose “${d.c[0]}”. ${d.bad?'Branch ends 2075 (age 86): investable assets −$38,276; net worth $2.57M only because of the house. Trunk = Sherpas path ('+d.n.opts.find(o=>o[3])[0]+').':'On the trunk.'}</div>`:'<div class=sub style="margin-top:6px">Tap a tick or branch to inspect it.</div>';
 return `<div style="overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:10px"><svg viewBox="0 0 ${EX+80} 300" width=${EX+80} height=300>${g}</svg></div>`+info;
}
function pick(i){const n=nodes[S.step],o=n.opts[i];
 const bad=!n.event&&!o[3];if(!n.event&&o[3])S.score=Math.max(S.score,o[2]);
 S.done.push({n,c:o,bad});S.step++;if(S.step>=nodes.length)S.step=nodes.length;render()}
reset();
</script></body></html>
