<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sherpas Life — Play Your Plan (Michael Carter Demo)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F4F6F9;
      --surface: #FFFFFF;
      --ink: #0F172A;
      --muted: #526075;
      --line: #E2E8F0;
      --emerald: #059669;
      --emerald-dark: #047857;
      --emerald-soft: #ECFDF5;
      --amber: #D97706;
      --amber-soft: #FFFBEB;
      --crimson: #DC2626;
      --crimson-soft: #FEF2F2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100dvh;
      display: flex;
      justify-content: center;
    }

    .phone-frame {
      width: 100%;
      max-width: 480px;
      min-height: 100dvh;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }

    /* Top HUD */
    .hud {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: 14px 16px 12px;
    }

    .hud-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .identity {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--ink);
      color: #fff;
      font-weight: 800;
      font-size: 16px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .name { font-size: 16px; font-weight: 800; line-height: 1.2; }
    .sub { font-size: 12px; color: var(--muted); font-weight: 500; }

    .lens-toggle {
      display: flex;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px;
      font-size: 11px;
      font-weight: 700;
    }

    .lens-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 5px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: background .15s, color .15s;
    }

    .lens-btn.active {
      background: var(--ink);
      color: #fff;
    }

    /* 4 Life Bars */
    .bars {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 12px;
    }

    .bar-item { display: flex; flex-direction: column; gap: 4px; }
    .bar-head {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
    }
    .bar-val {
      font-family: 'JetBrains Mono', monospace;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }
    .track {
      height: 7px;
      background: var(--bg);
      border-radius: 999px;
      overflow: hidden;
    }
    .fill {
      height: 100%;
      border-radius: 999px;
      transition: width .35s ease, background .25s ease;
    }

    /* Life Feed */
    .feed {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      padding-bottom: 110px;
    }

    .year-entry {
      border-left: 3px solid var(--line);
      padding-left: 12px;
      animation: popIn .22s ease-out;
    }
    .year-entry.good { border-left-color: var(--emerald); }
    .year-entry.warn { border-left-color: var(--amber); }
    .year-entry.crit { border-left-color: var(--crimson); }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .year-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 3px;
    }

    .year-text {
      font-size: 14px;
      line-height: 1.45;
      color: var(--ink);
    }

    .math-note {
      margin-top: 6px;
      padding: 7px 10px;
      background: var(--bg);
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      color: var(--muted);
      display: none;
    }
    body.advisor-mode .math-note { display: block; }

    /* Interactive Decision Card */
    .decision-card {
      background: var(--surface);
      border: 2px solid var(--ink);
      border-radius: 14px;
      padding: 14px;
      margin-top: 4px;
      animation: popIn .25s ease-out;
    }

    .decision-title {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .decision-desc {
      font-size: 13.5px;
      color: var(--muted);
      line-height: 1.45;
      margin-bottom: 12px;
    }

    .choices {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .choice-btn {
      text-align: left;
      background: var(--bg);
      border: 1.5px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .choice-btn:hover {
      border-color: var(--ink);
      background: #EDF2F7;
    }
    .choice-label { font-size: 13.5px; font-weight: 700; color: var(--ink); display: block; }
    .choice-hint { font-size: 12px; color: var(--muted); margin-top: 2px; display: block; }

    /* Quest / Day 3-30 Card */
    .quest-card {
      background: var(--emerald-soft);
      border: 1.5px solid var(--emerald);
      border-radius: 14px;
      padding: 14px;
    }
    .quest-card h3 { font-size: 15px; font-weight: 800; color: var(--emerald-dark); margin-bottom: 6px; }
    .quest-card p { font-size: 13px; line-height: 1.45; color: var(--ink); margin-bottom: 10px; }
    .checkin-pills {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .pill {
      font-size: 11px;
      font-weight: 700;
      background: #fff;
      border: 1px solid #A7F3D0;
      color: var(--emerald-dark);
      padding: 4px 8px;
      border-radius: 999px;
    }

    /* Bottom Controls */
    .controls {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 478px;
      background: var(--surface);
      border-top: 1px solid var(--line);
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      z-index: 20;
    }

    .age-btn {
      flex: 1;
      background: var(--emerald);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: background .15s, transform .1s;
    }
    .age-btn:hover:not(:disabled) { background: var(--emerald-dark); }
    .age-btn:active:not(:disabled) { transform: scale(0.98); }
    .age-btn:disabled { background: #CBD5E1; color: #64748B; cursor: not-allowed; }

    .reset-btn {
      background: var(--bg);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .reset-btn:hover { background: #E2E8F0; }
  </style>
</head>
<body>
  <main class="phone-frame">
    <header class="hud">
      <div class="hud-top">
        <div class="identity">
          <div class="avatar">MC</div>
          <div>
            <div class="name">Michael Carter <span id="hud-age">· Age 37</span></div>
            <div class="sub">Austin, TX · $180k/yr · Goal: Retire at 58</div>
          </div>
        </div>
        <div class="lens-toggle" role="group" aria-label="Explanation depth">
          <button class="lens-btn active" id="btn-plain" onclick="setLens(false)">Plain</button>
          <button class="lens-btn" id="btn-advisor" onclick="setLens(true)">Math</button>
        </div>
      </div>

      <div class="bars">
        <div class="bar-item">
          <div class="bar-head"><span>Net Worth</span><span class="bar-val" id="val-nw">$218.5k</span></div>
          <div class="track"><div class="fill" id="bar-nw" style="width:22%;background:var(--emerald)"></div></div>
        </div>
        <div class="bar-item">
          <div class="bar-head"><span>Cash Cushion</span><span class="bar-val" id="val-cash">3.2 mo</span></div>
          <div class="track"><div class="fill" id="bar-cash" style="width:53%;background:var(--amber)"></div></div>
        </div>
        <div class="bar-item">
          <div class="bar-head"><span>Retire Runway</span><span class="bar-val" id="val-retire">Runs out @ 85</span></div>
          <div class="track"><div class="fill" id="bar-retire" style="width:60%;background:var(--amber)"></div></div>
        </div>
        <div class="bar-item">
          <div class="bar-head"><span>Plan Health</span><span class="bar-val" id="val-score">26 / 100</span></div>
          <div class="track"><div class="fill" id="bar-score" style="width:26%;background:var(--crimson)"></div></div>
        </div>
      </div>
    </header>

    <section class="feed" id="feed"></section>

    <footer class="controls">
      <button class="reset-btn" onclick="resetGame()">Rewind</button>
      <button class="age-btn" id="age-btn" onclick="ageUp()">+ Age Up (2027)</button>
    </footer>
  </main>

  <script>
    let state;
    const feedEl = document.getElementById('feed');
    const ageBtn = document.getElementById('age-btn');

    function setLens(advisor) {
      document.body.classList.toggle('advisor-mode', advisor);
      document.getElementById('btn-plain').classList.toggle('active', !advisor);
      document.getElementById('btn-advisor').classList.toggle('active', advisor);
    }

    function updateHUD() {
      document.getElementById('hud-age').textContent = `· Age ${state.age}`;
      document.getElementById('val-nw').textContent = state.nw >= 1000 ? `$${(state.nw/1000).toFixed(2)}M` : `$${state.nw.toFixed(1)}k`;
      document.getElementById('bar-nw').style.width = `${Math.min(100, Math.max(5, (state.nw / 1600) * 100))}%`;

      document.getElementById('val-cash').textContent = `${state.cashMonths.toFixed(1)} mo`;
      const cashPct = Math.min(100, (state.cashMonths / 6) * 100);
      const cashBar = document.getElementById('bar-cash');
      cashBar.style.width = `${cashPct}%`;
      cashBar.style.background = state.cashMonths >= 5 ? 'var(--emerald)' : state.cashMonths >= 2 ? 'var(--amber)' : 'var(--crimson)';

      document.getElementById('val-retire').textContent = state.runsOutAt >= 91 ? 'Funded to 91' : `Runs out @ ${state.runsOutAt}`;
      const retBar = document.getElementById('bar-retire');
      retBar.style.width = `${state.runsOutAt >= 91 ? 100 : 65}%`;
      retBar.style.background = state.runsOutAt >= 91 ? 'var(--emerald)' : 'var(--crimson)';

      document.getElementById('val-score').textContent = `${state.score} / 100`;
      const scBar = document.getElementById('bar-score');
      scBar.style.width = `${state.score}%`;
      scBar.style.background = state.score >= 70 ? 'var(--emerald)' : state.score >= 45 ? 'var(--amber)' : 'var(--crimson)';
    }

    function addEntry(tag, text, math, tone = '') {
      const div = document.createElement('div');
      div.className = `year-entry ${tone}`;
      div.innerHTML = `
        <div class="year-tag">${tag}</div>
        <div class="year-text">${text}</div>
        ${math ? `<div class="math-note">${math}</div>` : ''}
      `;
      feedEl.appendChild(div);
      feedEl.scrollTop = feedEl.scrollHeight;
    }

    function showDecision(title, desc, options) {
      state.waitingChoice = true;
      ageBtn.disabled = true;
      ageBtn.textContent = 'Make a choice above';

      const card = document.createElement('div');
      card.className = 'decision-card';
      card.innerHTML = `<div class="decision-title">${title}</div><div class="decision-desc">${desc}</div><div class="choices"></div>`;
      const choicesEl = card.querySelector('.choices');

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerHTML = `<span class="choice-label">${opt.label}</span><span class="choice-hint">${opt.hint}</span>`;
        btn.onclick = () => {
          card.remove();
          state.waitingChoice = false;
          ageBtn.disabled = false;
          opt.action();
          updateHUD();
        };
        choicesEl.appendChild(btn);
      });

      feedEl.appendChild(card);
      feedEl.scrollTop = feedEl.scrollHeight;
    }

    function showRealQuest() {
      const card = document.createElement('div');
      card.className = 'quest-card';
      card.innerHTML = `
        <h3>Real-Life Step 1 (3 min)</h3>
        <p>You just saw how one sequence changes your 50s and 80s. Your first real move today: <strong>pay off the $3,500 Amex (20% APR)</strong> from your $27,000 bank cash.</p>
        <div class="checkin-pills">
          <span class="pill">Day 3 Check-in: Card paid?</span>
          <span class="pill">Day 30: Boost 401(k) toward $24.5k</span>
        </div>
      `;
      feedEl.appendChild(card);
      feedEl.scrollTop = feedEl.scrollHeight;
    }

    function ageUp() {
      if (state.waitingChoice || state.done) return;
      state.step += 1;

      if (state.step === 1) {
        state.age = 38;
        state.year = 2027;
        showDecision(
          'January 2027 · The $550,000 Austin Home',
          'You have $30k accessible cash ($16.5k short of a 5-month reserve) and a $3,500 Amex at 20% APR. What do you do?',
          [
            {
              label: 'Buy the $550k house now (Current Plan)',
              hint: '$113,300 down + $9,464 closing costs · $3,015/mo mortgage (7%)',
              action: () => {
                state.boughtEarly = true;
                state.cashMonths = 0.0;
                state.nw = 228;
                addEntry(
                  'AGE 38 · 2027',
                  'You bought the house! Investable assets dropped from $178.7k to $81.2k and your cash reserve hit 0 months.',
                  'Mortgage $3,015/mo + $5,665/yr tax + $2,833/yr ins. Net cash flow: -$8,336/yr.',
                  'crit'
                );
                ageBtn.textContent = '+ Age Up (2028)';
              }
            },
            {
              label: 'Kill 20% Amex + max 401(k), delay house 2 yrs',
              hint: 'Save $1,800/yr in taxes + keep 5-month cash cushion intact',
              action: () => {
                state.boughtEarly = false;
                state.cashMonths = 5.4;
                state.nw = 272;
                state.score = 62;
                state.runsOutAt = 91;
                addEntry(
                  'AGE 38 · 2027',
                  'Smart sequence: you wiped out the $3,500 Amex (20% APR), captured full $24.5k 401(k) room, and kept renting at $2,800/mo.',
                  'Saved $700/yr interest + ~$1,800/yr tax shield. Cash reserve: 5.4 months.',
                  'good'
                );
                ageBtn.textContent = '+ Age Up (2028)';
              }
            }
          ]
        );
      } else if (state.step === 2) {
        state.age = 45;
        state.year = 2034;
        if (state.boughtEarly) {
          state.nw = 540;
          state.cashMonths = 2.1;
          addEntry(
            'AGE 45 · 2034',
            'Your income is strong, but tight cash flow and a $720k life-insurance gap keep your safety net fragile.',
            'Whole life cover: $180k vs $900k-$1.8M recommended. No $1M umbrella policy.',
            'warn'
          );
        } else {
          state.nw = 710;
          state.cashMonths = 6.0;
          state.score = 76;
          addEntry(
            'AGE 45 · 2034',
            'You bought your home with a full 6-month buffer and zero high-interest debt. Compounding is doing the heavy lifting.',
            'Savings rate >25% of $180k income; emergency reserve fully funded ($55.8k).',
            'good'
          );
        }
        ageBtn.textContent = '+ Age Up (Age 58 · Target Retire)';
      } else if (state.step === 3) {
        state.age = 58;
        state.year = 2047;
        if (state.boughtEarly) {
          state.nw = 1535;
          addEntry(
            'AGE 58 · RETIREMENT DAY',
            'You reached $1.54M net worth ($1.07M liquid) and retired at 58. Looks great—let’s see if it lasts.',
            'Social Security covers 34% of $89,649/yr need; portfolio draw is 5.6%/yr.',
            'warn'
          );
        } else {
          state.nw = 1980;
          state.score = 84;
          addEntry(
            'AGE 58 · RETIREMENT DAY',
            'You hit $1.98M net worth and retired at 58 with room to spare.',
            'Lower draw rate + zero consumer debt keeps portfolio resilient through age 91.',
            'good'
          );
        }
        ageBtn.textContent = '+ Age Up (See Ending)';
      } else if (state.step === 4) {
        state.done = true;
        if (state.boughtEarly) {
          state.age = 85;
          state.nw = 0;
          addEntry(
            'AGE 85 · SHORTFALL',
            'Your savings ran out 6 years before age 91, leaving $32,439 of planned spending unpaid. Rewind to 2027 to test another sequence.',
            'Plan shortfall at retirement: $1,177,586 in today’s dollars (+$20,231/yr needed).',
            'crit'
          );
        } else {
          state.age = 91;
          state.nw = 620;
          addEntry(
            'AGE 91 · PLAN COMPLETE',
            'You stayed funded all the way to 91 without giving up your retirement at 58.',
            'Sequence impact: fixing cash flow & high-APR debt early closed the $1.18M gap.',
            'good'
          );
        }
        ageBtn.disabled = true;
        ageBtn.textContent = 'Timeline Complete';
        showRealQuest();
      }
      updateHUD();
    }

    function resetGame() {
      state = {
        age: 37,
        year: 2026,
        nw: 218.5,
        cashMonths: 3.2,
        runsOutAt: 85,
        score: 26,
        step: 0,
        boughtEarly: true,
        waitingChoice: false,
        done: false
      };
      feedEl.innerHTML = '';
      ageBtn.disabled = false;
      ageBtn.textContent = '+ Age Up (2027)';
      addEntry(
        'AGE 37 · TODAY (2026)',
        'You earn $180,000/yr in Austin and save $43,000/yr, yet your plan score is 26/100. Tap "+ Age Up" to play how your choices play out.',
        'Assets $247k · Debts $28.5k (incl. $3.5k Amex @ 20%) · Cash $30k (3.2 mo).',
        'warn'
      );
      updateHUD();
    }

    resetGame();
  </script>
</body>
</html>
